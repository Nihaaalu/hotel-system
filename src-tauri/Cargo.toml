[package]
name = "hotel-management-desktop"
version = "1.0.0"
description = "A production-grade offline-first SQLite-based Hotel Management client config."
authors = ["Hotel Management Developer"]
edition = "2021"
rust-version = "1.57"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "1.5", features = ["path-all", "shell-open", "api-all"] }
tauri-plugin-sql = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

[features]
# by default tauri runs in production mode, customprotocol allows loading frontend assets locally
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
